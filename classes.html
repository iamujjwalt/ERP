<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes & Sections | EduSched Pro</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="app" class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 transition-all duration-300"></aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header id="header" class="h-16 bg-white border-bottom border-gray-100 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm"></header>

            <div id="content" class="flex-1 overflow-y-auto p-6">
                <!-- Page Header -->
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Academic Architecture</h1>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Cohorts, sections and spatial assignments</p>
                    </div>
                    <button id="btn-add-class" class="btn-primary flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Register Cohort</span>
                    </button>
                </div>

                <!-- Classes Grid -->
                <div id="classes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Injected by class.js -->
                </div>
            </div>
        </main>
    </div>

    <div id="class-modal" class="fixed inset-0 z-50 invisible opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-xl bg-white shadow-2xl flex flex-col transform translate-x-full transition-transform duration-500 ease-in-out">
            <div class="p-8 border-b border-slate-100 flex items-center justify-between">
                <div class="flex flex-col">
                    <h2 id="modal-title" class="text-xl font-bold text-slate-900 tracking-tight">Class Registry</h2>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Structural Configuration</p>
                </div>
                <button id="close-modal" class="h-10 w-10 flex items-center justify-center hover:bg-slate-100 rounded-full text-slate-400 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="class-form" class="flex-1 overflow-y-auto p-8 space-y-8">
                <input type="hidden" id="edit-id">
                
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Grade Level</label>
                        <select id="c-grade" name="grade" required class="input-field">
                            <option value="">Select Grade</option>
                            <option value="1">Grade 1</option>
                            <option value="2">Grade 2</option>
                            <option value="3">Grade 3</option>
                            <option value="4">Grade 4</option>
                            <option value="5">Grade 5</option>
                            <option value="6">Grade 6</option>
                            <option value="7">Grade 7</option>
                            <option value="8">Grade 8</option>
                            <option value="9">Grade 9</option>
                            <option value="10">Grade 10</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Section Identifier</label>
                        <input type="text" id="c-section" name="section" required class="input-field" placeholder="e.g. A, Everest, Blue">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Academic Mentor (Class Teacher)</label>
                    <select id="c-teacher" name="classTeacher" class="input-field">
                        <option value="">Select Lead Faculty</option>
                        <!-- Injected by class.js -->
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Spatial Assignment (Room)</label>
                    <input type="text" id="c-room" name="room" class="input-field" placeholder="Room 101, Main Block">
                </div>

                <div class="p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100">
                    <p class="text-[10px] text-indigo-700 font-bold uppercase tracking-tight leading-relaxed">
                        <i data-lucide="info" class="w-3 h-3 inline-block mr-1"></i>
                        CURRICULUM MAPPING: SUBJECTS AND STAFF CAN BE LINKED PRECISELY WITHIN THE SMART ROUTINE BUILDER.
                    </p>
                </div>
            </form>

            <div class="p-8 border-t border-slate-100 flex gap-4 bg-slate-50/50">
                <button id="cancel-form" class="btn-secondary flex-1 font-bold text-[10px] uppercase">DISCARD</button>
                <button id="submit-form" class="btn-primary flex-1 bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-500/20 font-bold text-[10px] uppercase">SAVE COHORT</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="/js/class.js"></script>
</body>
</html>
