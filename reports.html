<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics | EduSched Pro</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="app" class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 transition-all duration-300"></aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header id="header" class="h-16 bg-white border-bottom border-gray-100 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm"></header>

            <div id="content" class="flex-1 overflow-y-auto p-6">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Intelligence & Analytics</h1>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Resource utilization and performance audits</p>
                    </div>
                    <div class="flex gap-2">
                        <button id="btn-export-pdf" class="btn-secondary flex items-center gap-2 font-bold text-[10px] uppercase tracking-widest border-slate-200">
                            <i data-lucide="file-text" class="w-3.5 h-3.5 text-indigo-500"></i>
                            Export PDF
                        </button>
                        <button id="btn-export-excel" class="btn-secondary flex items-center gap-2 font-bold text-[10px] uppercase tracking-widest border-slate-200">
                            <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-emerald-500"></i>
                            Export XLSX
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                    <div class="card">
                        <h3 class="text-sm font-bold text-slate-800 mb-8 uppercase tracking-tight">Faculty Load Balancing</h3>
                        <canvas id="workload-chart"></canvas>
                    </div>
                    <div class="card">
                        <h3 class="text-sm font-bold text-slate-800 mb-8 uppercase tracking-tight">Curriculum Intensity Map</h3>
                        <div class="h-64">
                            <canvas id="subject-period-chart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="text-sm font-bold text-slate-800 mb-8 uppercase tracking-tight">Audit Log: Faculty Workload</h3>
                    <div class="overflow-x-auto">
                        <table class="data-table" id="report-table">
                            <thead>
                                <tr>
                                    <th>UID</th>
                                    <th>IDENTITY</th>
                                    <th>WEEKLY LOAD</th>
                                    <th>CAPACITY</th>
                                    <th>DUTY COUNTS</th>
                                    <th>AUDIT STATUS</th>
                                </tr>
                            </thead>
                            <tbody id="report-table-body" class="divide-y divide-slate-50">
                                <!-- Injected by analytics.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script type="module" src="/js/analytics.js"></script>
</body>
</html>
