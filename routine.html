<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Routine Builder | EduSched Pro</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        .period-slot { min-height: 80px; }
        .dragging { opacity: 0.5; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="app" class="flex min-h-screen">
        <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 transition-all duration-300"></aside>

        <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <header id="header" class="h-16 bg-white border-bottom border-gray-100 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm"></header>

            <div id="content" class="flex-1 overflow-y-auto p-6">
                <!-- Routine Controls -->
                <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Smart Scheduler</h1>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Conflict-free routine architecture</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <select id="select-class" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all">
                            <option value="">Select Target Cohort...</option>
                            <!-- Injected by routine.js -->
                        </select>
                        <button id="btn-save-routine" class="btn-primary flex items-center gap-2 bg-slate-900 text-white hover:bg-slate-800">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            <span>COMMIT CHANGES</span>
                        </button>
                    </div>
                </div>

                <!-- Routine Workspace -->
                <div id="routine-workspace" class="hidden">
                    <!-- Global Actions -->
                    <div class="flex items-center gap-3 mb-6 p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100">
                        <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center shrink-0">
                            <i data-lucide="zap" class="w-4 h-4 text-indigo-600"></i>
                        </div>
                        <p class="text-[11px] text-indigo-900 font-medium flex-1 tracking-tight leading-relaxed">
                            <strong>OPTIMIZATION TIP:</strong> Configure your <span class="text-indigo-600 font-bold uppercase">Sunday</span> template first. Use the replicate engine to synchronize it globally.
                        </p>
                        <button id="btn-copy-sunday" class="px-4 py-1.5 bg-indigo-600 text-white text-[10px] font-bold uppercase tracking-widest rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/20 active:scale-95">
                            Sync Sunday Template
                        </button>
                    </div>

                    <!-- Weekly Grid -->
                    <div class="overflow-x-auto pb-6">
                        <div id="routine-grid" class="flex gap-6 min-w-[1200px]">
                            <!-- Day Columns (Sunday - Friday) -->
                            <!-- Injected by routine.js -->
                        </div>
                    </div>
                </div>

                <div id="no-class-selected" class="py-24 text-center">
                    <div class="max-w-md mx-auto">
                        <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-300">
                            <i data-lucide="calendar-plus" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-lg font-bold text-slate-400">SELECT A COHORT</h2>
                        <p class="text-xs text-slate-400 mt-2 uppercase font-bold tracking-widest">Choose a grade level from the dropdown to start building</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Period Context Modal -->
    <div id="period-modal" class="fixed inset-0 z-50 invisible opacity-0 transition-all duration-300 pointer-events-none">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="absolute inset-x-0 bottom-0 sm:inset-auto sm:left-1/2 sm:top-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full max-w-md bg-white sm:rounded-3xl shadow-2xl flex flex-col transform translate-y-full sm:translate-y-0 transition-transform duration-500 ease-in-out overflow-hidden">
            <div class="p-8 border-b border-slate-100 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Configure Slot</h2>
                    <p id="period-info" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 italic">TENTATIVE ASSIGNMENT</p>
                </div>
                <button id="close-period-modal" class="h-10 w-10 flex items-center justify-center hover:bg-slate-100 rounded-full text-slate-400 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-8 space-y-8">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Slot Classification</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button class="slot-type-btn p-4 rounded-2xl border border-slate-100 text-[10px] font-bold uppercase tracking-tight flex flex-col items-center gap-3 transition-all hover:bg-slate-50 bg-white group" data-type="subject">
                            <i data-lucide="book-open" class="w-5 h-5 text-indigo-500 group-hover:scale-110 transition-transform"></i>
                            Academic
                        </button>
                        <button class="slot-type-btn p-4 rounded-2xl border border-slate-100 text-[10px] font-bold uppercase tracking-tight flex flex-col items-center gap-3 transition-all hover:bg-slate-50 bg-white group" data-type="lunch">
                            <i data-lucide="coffee" class="w-5 h-5 text-amber-500 group-hover:scale-110 transition-transform"></i>
                            Nutrition
                        </button>
                        <button class="slot-type-btn p-4 rounded-2xl border border-slate-100 text-[10px] font-bold uppercase tracking-tight flex flex-col items-center gap-3 transition-all hover:bg-slate-50 bg-white group" data-type="break">
                            <i data-lucide="clock" class="w-5 h-5 text-rose-500 group-hover:scale-110 transition-transform"></i>
                            Recess
                        </button>
                    </div>
                </div>

                <div id="subject-selector" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-left">Curriculum</label>
                        <select id="p-subject" class="input-field">
                            <option value="">Choose Course</option>
                            <!-- Injected by routine.js -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 text-left">Faculty Member</label>
                        <select id="p-teacher" class="input-field">
                            <option value="">Assign Faculty</option>
                            <!-- Injected by routine.js -->
                        </select>
                    </div>
                </div>
            </div>

            <div class="p-8 border-t border-slate-100 flex gap-4 bg-slate-50/50">
                <button id="clear-period" class="btn-secondary text-rose-600 border-rose-100 hover:bg-rose-50 flex-1 font-bold text-[10px] uppercase">Wipe Slot</button>
                <button id="save-period" class="btn-primary flex-1 bg-indigo-600 hover:bg-indigo-700 shadow-lg shadow-indigo-500/20 font-bold text-[10px] uppercase">Update Unit</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="/js/routine.js"></script>
</body>
</html>
